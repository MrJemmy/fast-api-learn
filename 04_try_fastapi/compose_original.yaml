volumes:
  postgres_data:

services:
  app:
    image: fast_api_learn:v1
    build:
      context: .
      dockerfile: Dockerfile.gpt
    env_file:
      - .env
    container_name: fast_api_learn
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/code:rw
    depends_on:
      - db_postgres
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: DockrFile
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: compose.yaml 
        - action: rebuild
          path: .env
  
  db_postgres:
    image: postgres:18.0-alpine3.22
    container_name: db_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  